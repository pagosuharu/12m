<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>正十二面体の展開図クイズ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#eef0f4;color:#232b38;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;
    max-width:880px;margin:0 auto;padding:8px;gap:6px;}
  header{flex:0 0 auto;text-align:center;}
  h1{margin:0;font-size:17px;letter-spacing:.02em;}
  .desc{margin:2px 0 0;font-size:12px;line-height:1.4;color:#555f6e;}
  #stage{position:relative;flex:1 1 auto;min-height:0;background:#fbfcfd;
    border:1px solid #d5d9e0;border-radius:12px;overflow:hidden;}
  #cv{position:absolute;left:0;top:0;display:block;touch-action:none;}
  #hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;
    font-size:10px;color:#98a1ae;pointer-events:none;}
  #msg{flex:0 0 auto;min-height:38px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:13px;line-height:1.35;padding:4px 6px;border-radius:9px;
    background:#fff;border:1px solid #dfe3ea;color:#37414f;}
  #msg.ok{background:#e8f6ec;border-color:#9fd4ae;color:#1c6b34;font-weight:bold;}
  #msg.ng{background:#fdeceb;border-color:#efb0ab;color:#9c2b22;font-weight:bold;}
  #msg.info{background:#fff8e4;border-color:#eed79a;color:#7a5b10;}
  .btns{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;}
  button{flex:1 1 calc(50% - 3px);min-width:0;padding:11px 4px;font-size:13.5px;
    font-family:inherit;color:#28313d;background:#fff;border:1px solid #c2c8d2;
    border-radius:9px;cursor:pointer;}
  button:active{background:#eaeef4;}
  button.primary{background:#1565c0;border-color:#1565c0;color:#fff;}
  button.primary:active{background:#0f4f99;}
  .slider{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:2px 2px 0;
    font-size:11.5px;color:#4c5665;}
  .slider label{display:none;}
  .seedline{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;color:#77818f;}
  button:disabled{opacity:.55;cursor:wait;}
  .slider input[type=range]{flex:1 1 auto;min-width:0;}
  .slider span{width:40px;text-align:right;font-variant-numeric:tabular-nums;}
  button.mini{flex:0 0 auto;min-width:0;padding:7px 9px;font-size:11.5px;border-radius:7px;}
  button.mini.on{background:#1565c0;border-color:#1565c0;color:#fff;}
  @media (min-width:600px){
    h1{font-size:20px;} .desc{font-size:13px;}
    button{flex:1 1 0;font-size:14px;} #msg{font-size:14px;}
    button.mini{flex:0 0 auto;font-size:12.5px;}
    .slider{font-size:12.5px;} .slider label{display:inline;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>正十二面体の展開図クイズ</h1>
    <p class="desc">辺Aと、正十二面体に組み立てたときに一致する辺を1〜5から選んでください。</p>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">ドラッグ／スワイプで回転・ピンチやホイールで拡大縮小</div>
  </div>

  <div id="msg">番号の丸をタップして答えを選んでください。</div>

  <div class="btns">
    <button id="btnStep">1面ずつ折る</button>
    <button id="btnAuto">自動で折る</button>
    <button id="btnAnswer" class="primary">答えを表示</button>
    <button id="btnReset">リセット</button>
  </div>

  <div class="slider">
    <label for="rngFold">折りたたみ</label>
    <input id="rngFold" type="range" min="0" max="100" value="0" step="1" title="折りたたみ具合">
    <span id="pct">0%</span>
    <button id="btnSpeed" class="mini">ゆっくり</button>
    <button id="btnNum" class="mini">数字を隠す</button>
  </div>
  <div class="seedline"><button id="btnNew" class="mini">新しい問題</button><span id="seedLabel"></span></div>
</div>

<!-- =====================================================================
     スクリプト1：幾何モデル（DOMを一切使わない純粋な計算部分）
     正十二面体の座標 → 面 → 隣接関係 → 展開図（木構造）→ 問題生成
     ===================================================================== -->
<script>
var MODEL = (function create(seed) {
  "use strict";

  seed = Number(seed) >>> 0;
  // おなじシードなら、おなじ順にくじをひく（mulberry32）。
  var randomState = seed;
  function random() {
    randomState = (randomState + 0x6D2B79F5) >>> 0;
    var t = randomState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var PHI = (1 + Math.sqrt(5)) / 2, IPHI = 1 / PHI;

  /* ---------- ベクトル演算 ---------- */
  function sub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
  function add(a, b) { return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
  function mul(a, s) { return [a[0]*s, a[1]*s, a[2]*s]; }
  function dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
  function cross(a, b) {
    return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  }
  function len(a) { return Math.sqrt(dot(a, a)); }
  function norm(a) { var l = len(a); return [a[0]/l, a[1]/l, a[2]/l]; }
  function dist(a, b) { return len(sub(a, b)); }

  /* ---------- 剛体変換 {m:3x3(行優先), t:平行移動} ---------- */
  function tId() { return { m: [1,0,0, 0,1,0, 0,0,1], t: [0,0,0] }; }
  function tApply(T, p) {
    var m = T.m, t = T.t;
    return [
      m[0]*p[0] + m[1]*p[1] + m[2]*p[2] + t[0],
      m[3]*p[0] + m[4]*p[1] + m[5]*p[2] + t[1],
      m[6]*p[0] + m[7]*p[1] + m[8]*p[2] + t[2]
    ];
  }
  /* A∘B（先にBを適用してからA） */
  function tMul(A, B) {
    var m = new Array(9), i, j, k, s;
    for (i = 0; i < 3; i++) for (j = 0; j < 3; j++) {
      s = 0;
      for (k = 0; k < 3; k++) s += A.m[i*3+k] * B.m[k*3+j];
      m[i*3+j] = s;
    }
    return { m: m, t: tApply(A, B.t) };
  }
  /* 点Pを通り方向d（単位ベクトル）の軸まわりにang回転 */
  function rotAxis(P, d, ang) {
    var c = Math.cos(ang), s = Math.sin(ang), C = 1 - c;
    var x = d[0], y = d[1], z = d[2];
    var m = [
      c + C*x*x,   C*x*y - s*z, C*x*z + s*y,
      C*y*x + s*z, c + C*y*y,   C*y*z - s*x,
      C*z*x - s*y, C*z*y + s*x, c + C*z*z
    ];
    var R = { m: m, t: [0,0,0] };
    var RP = tApply(R, P);
    return { m: m, t: [P[0]-RP[0], P[1]-RP[1], P[2]-RP[2]] };
  }
  /* 単位ベクトルaをbに重ねる回転 */
  function rotFromTo(a, b) {
    var v = cross(a, b), c = dot(a, b), l = len(v);
    if (l < 1e-12) {
      if (c > 0) return tId();
      var ax = Math.abs(a[0]) < 0.9 ? cross(a, [1,0,0]) : cross(a, [0,1,0]);
      return rotAxis([0,0,0], norm(ax), Math.PI);
    }
    return rotAxis([0,0,0], norm(v), Math.atan2(l, c));
  }

  /* ---------- 正十二面体の頂点（20個） ---------- */
  function buildVerts() {
    var V = [], a, b, c, s1, s2;
    for (a = 1; a >= -1; a -= 2)
      for (b = 1; b >= -1; b -= 2)
        for (c = 1; c >= -1; c -= 2) V.push([a, b, c]);
    for (s1 = 1; s1 >= -1; s1 -= 2)
      for (s2 = 1; s2 >= -1; s2 -= 2) {
        V.push([0, s1*IPHI, s2*PHI]);
        V.push([s1*IPHI, s2*PHI, 0]);
        V.push([s2*PHI, 0, s1*IPHI]);
      }
    return V; // 8 + 12 = 20
  }
  /* ---------- 面の外向き法線（12個＝正二十面体の頂点方向） ---------- */
  function buildNormals() {
    var N = [], s1, s2;
    for (s1 = 1; s1 >= -1; s1 -= 2)
      for (s2 = 1; s2 >= -1; s2 -= 2) {
        N.push([s1, 0, s2*PHI]);
        N.push([0, s2*PHI, s1]);
        N.push([s2*PHI, s1, 0]);
      }
    return N; // 12
  }

  var V = buildVerts();
  var NS = buildNormals();

  /* ---------- 各法線について「内積最大の5頂点」を取り出して面にする ---------- */
  var faces = [];
  (function () {
    for (var i = 0; i < NS.length; i++) {
      var n = norm(NS[i]);
      var ds = V.map(function (v) { return dot(v, n); });
      var best = -Infinity, j;
      for (j = 0; j < ds.length; j++) if (ds[j] > best) best = ds[j];
      var idx = [];
      for (j = 0; j < ds.length; j++) if (Math.abs(ds[j] - best) < 1e-9) idx.push(j);
      var c = [0,0,0];
      for (j = 0; j < idx.length; j++) c = add(c, V[idx[j]]);
      c = mul(c, 1 / idx.length);
      // 法線まわりの角度でソート（外から見て反時計回り）
      var u = norm(sub(V[idx[0]], c)), w = cross(n, u);
      idx.sort(function (p, q) {
        var pa = sub(V[p], c), pb = sub(V[q], c);
        return Math.atan2(dot(pa, w), dot(pa, u)) - Math.atan2(dot(pb, w), dot(pb, u));
      });
      faces.push({ vi: idx, n: n, c: c });
    }
  })();

  /* ---------- 辺と隣接関係 ---------- */
  function ekey(a, b) { return a < b ? a + "_" + b : b + "_" + a; }
  var edgeMap = {};      // 辺キー → [{f,k}, {f,k}]
  var neigh = [];        // neigh[f][k] = {f:相手の面, k:相手側の辺番号}
  (function () {
    var f, k, key;
    for (f = 0; f < faces.length; f++) {
      for (k = 0; k < 5; k++) {
        key = ekey(faces[f].vi[k], faces[f].vi[(k+1) % 5]);
        if (!edgeMap[key]) edgeMap[key] = [];
        edgeMap[key].push({ f: f, k: k });
      }
    }
    for (f = 0; f < faces.length; f++) neigh.push(new Array(5));
    for (key in edgeMap) {
      var s = edgeMap[key];
      if (s.length !== 2) continue;
      neigh[s[0].f][s[0].k] = { f: s[1].f, k: s[1].k, key: key };
      neigh[s[1].f][s[1].k] = { f: s[0].f, k: s[0].k, key: key };
    }
  })();

  // となりあう面の辺をまぜ、輪ができないものを11本えらぶ。
  var root, oppo, parent, parentK, depth, topo, foldOrder;
  function randomTree() {
    root = Math.floor(random() * 12);
    var groups = [], links = [], edges = shuffle(Object.keys(edgeMap).sort());
    for (var f = 0; f < 12; f++) { groups.push(f); links.push([]); }
    function group(f) { while (groups[f] !== f) f = groups[f]; return f; }
    var count = 0;
    for (var i = 0; i < edges.length && count < 11; i++) {
      var pair = edgeMap[edges[i]], a = pair[0], b = pair[1];
      var ga = group(a.f), gb = group(b.f);
      if (ga === gb) continue;
      groups[ga] = gb; count++;
      links[a.f].push({ f: b.f, k: b.k });
      links[b.f].push({ f: a.f, k: a.k });
    }
    parent = new Array(12).fill(-1); parentK = new Array(12).fill(-1);
    depth = new Array(12).fill(-1); depth[root] = 0;
    var queue = [root];
    for (var q = 0; q < queue.length; q++) {
      var p = queue[q];
      links[p].forEach(function (nb) {
        if (depth[nb.f] >= 0) return;
        parent[nb.f] = p; parentK[nb.f] = nb.k;
        depth[nb.f] = depth[p] + 1; queue.push(nb.f);
      });
    }
    setOrder();
  }
  function setOrder() {
    topo = []; foldOrder = []; oppo = -1;
    for (var f = 0; f < 12; f++) {
      topo.push(f);
      if (parent[f] >= 0) foldOrder.push(f);
      if (dot(faces[f].n, faces[root].n) < -0.99) oppo = f;
    }
    topo.sort(function (a, b) { return depth[a] - depth[b] || a - b; });
    foldOrder.sort(function (a, b) { return depth[b] - depth[a] || a - b; });
  }

  /* ---------- 展開（立体 → 平面）と、折り目の情報 ---------- */
  // 正十二面体の二面角
  var DIHEDRAL = Math.acos(-1 / Math.sqrt(5));   // ≒116.565°
  var THETA = Math.PI - DIHEDRAL;                // ≒63.435°（平面からの折り曲げ量）

  var U, nodes, unfoldReport;

  // beta: 展開図を平面内で回す角度（画面に収まりやすい向きにするため）
  function buildUnfold(beta) {
    U = new Array(12); nodes = new Array(12); unfoldReport = [];
    // 面が手前（+z側）へ折り上がるように、基準面の表を奥に向けておく
    var R0 = tMul(rotAxis([0,0,0], [0,0,1], beta), rotFromTo(faces[root].n, [0,0,-1]));
    var c0 = tApply(R0, faces[root].c);
    U[root] = { m: R0.m, t: [R0.t[0]-c0[0], R0.t[1]-c0[1], R0.t[2]-c0[2]] };
    nodes[root] = { parent: -1, hingeP: [0,0,0], hingeD: [1,0,0], foldAngle: 0, k: -1 };

    for (var oi = 0; oi < topo.length; oi++) {
      var f = topo[oi];
      if (f === root) continue;
      var p = parent[f], k = parentK[f];
      var va = faces[f].vi[k], vb = faces[f].vi[(k+1) % 5];
      var A = tApply(U[p], V[va]), B = tApply(U[p], V[vb]);
      var d = norm(sub(B, A));
      // 折り目に乗っていない頂点を1つ選び、平らになる回転方向を判定する
      var vt = -1;
      for (var j = 0; j < 5; j++) {
        var vi2 = faces[f].vi[j];
        if (vi2 !== va && vi2 !== vb) { vt = vi2; break; }
      }
      var bestS = 0, bestZ = Infinity, bestT = null, otherZ = 0;
      for (var si = 0; si < 2; si++) {
        var s = si === 0 ? 1 : -1;
        var T = tMul(rotAxis(A, d, s * THETA), U[p]);
        var z = Math.abs(tApply(T, V[vt])[2]);
        if (z < bestZ) { otherZ = bestZ; bestZ = z; bestS = s; bestT = T; }
        else { otherZ = z; }
      }
      U[f] = bestT;
      nodes[f] = {
        parent: p, k: k,
        hingeP: A, hingeD: d,
        foldAngle: -bestS * THETA     // 折りたたみは展開の逆回転
      };
      unfoldReport.push({ f: f, flatZ: bestZ, otherZ: otherZ });
    }
  }

  /* ---------- 展開図の座標（z=0 平面） ---------- */
  var net = [];
  function buildNet() {
    net = [];
    for (var f = 0; f < 12; f++) {
      var arr = [];
      for (var k = 0; k < 5; k++) {
        var p = tApply(U[f], V[faces[f].vi[k]]);
        arr.push([p[0], p[1], 0]);
      }
      net.push(arr);
    }
  }

  var EDGE_LEN = dist(V[faces[0].vi[0]], V[faces[0].vi[1]]);
  var boundary, quiz;

  // それぞれの面を、まんなかへ2%ちぢめる。ふちの接触は重なりにしない。
  function noOverlap() {
    var small = net.map(function (face) {
      var c = mul(face.reduce(add, [0,0,0]), 0.2);
      return face.map(function (p) { return add(c, mul(sub(p, c), 0.98)); });
    });
    function overlaps(a, b) {
      for (var side = 0; side < 2; side++) {
        var poly = side ? b : a;
        for (var k = 0; k < 5; k++) {
          var p = poly[k], q = poly[(k+1)%5], ax = -(q[1]-p[1]), ay = q[0]-p[0];
          var amin = Infinity, amax = -Infinity, bmin = Infinity, bmax = -Infinity;
          for (var j = 0; j < 5; j++) {
            var av = a[j][0]*ax + a[j][1]*ay, bv = b[j][0]*ax + b[j][1]*ay;
            amin = Math.min(amin,av); amax = Math.max(amax,av);
            bmin = Math.min(bmin,bv); bmax = Math.max(bmax,bv);
          }
          if (amax <= bmin + 1e-10 || bmax <= amin + 1e-10) return false;
        }
      }
      return true;
    }
    for (var a = 0; a < 12; a++) for (var b = a+1; b < 12; b++)
      if (overlaps(small[a],small[b])) return false;
    return true;
  }

  // 1度ずつまわして、3:4のわくに大きくおさまる向きをさがす。
  // シードの再現を守るため、端末によって作問の形は変えない。
  function bestOrientation() {
    var pts = [].concat.apply([], net), best = { beta: 0, score: Infinity };
    for (var deg = 0; deg < 180; deg++) {
      var a = deg*Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
      var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (var i = 0; i < pts.length; i++) {
        var x = pts[i][0]*ca-pts[i][1]*sa, y = pts[i][0]*sa+pts[i][1]*ca;
        x0 = Math.min(x0,x); x1 = Math.max(x1,x); y0 = Math.min(y0,y); y1 = Math.max(y1,y);
      }
      var w = x1-x0, h = y1-y0, fit = Math.max(w/0.75,h);
      var score = fit*fit + 0.15*w*h;
      if (score < best.score - 1e-10) best = { beta: a, score: score };
    }
    return best;
  }
  function slotKey(f,k) { return ekey(faces[f].vi[k],faces[f].vi[(k+1)%5]); }
  function buildBoundary() {
    var hinges = {}; boundary = [];
    for (var f = 0; f < 12; f++) if (parent[f] >= 0) hinges[slotKey(f,parentK[f])] = true;
    for (f = 0; f < 12; f++) for (var k = 0; k < 5; k++) {
      var key = slotKey(f,k);
      if (hinges[key]) continue;
      var mid = mul(add(net[f][k],net[f][(k+1)%5]),0.5);
      var center = mul(net[f].reduce(add,[0,0,0]),0.2);
      boundary.push({ f:f, k:k, key:key, mid:mid, label:add(mid,mul(sub(center,mid),0.24)) });
    }
  }
  function treeDistance(a,b) {
    var d = 0;
    while (depth[a] > depth[b]) { a = parent[a]; d++; }
    while (depth[b] > depth[a]) { b = parent[b]; d++; }
    while (a !== b) { a = parent[a]; b = parent[b]; d += 2; }
    return d;
  }
  function separated(a,b) {
    return dist(a.mid,b.mid) > EDGE_LEN*0.6 && dist(a.label,b.label) > EDGE_LEN;
  }
  function makeQuiz() {
    var choices = shuffle(boundary.slice());
    for (var ai = 0; ai < choices.length; ai++) {
      var A = choices[ai];
      var ans = boundary.filter(function (b) { return b.key === A.key && b.f !== A.f; })[0];
      if (!ans || dist(A.mid,ans.mid) < EDGE_LEN*3 || treeDistance(A.f,ans.f) < 4) continue;
      var pool = shuffle(boundary.filter(function (b) { return b.key !== A.key; }));
      pool.sort(function (a,b) { return dist(a.mid,ans.mid)-dist(b.mid,ans.mid); });
      var cands = [ans], usedFace = {}, usedKey = {};
      usedFace[A.f] = true; usedFace[ans.f] = true; usedKey[A.key] = true;
      for (var i = 0; i < pool.length && cands.length < 5; i++) {
        var c = pool[i];
        if (usedFace[c.f] || usedKey[c.key] || !separated(c,A)) continue;
        if (!cands.every(function (b) { return separated(c,b); })) continue;
        cands.push(c); usedFace[c.f] = true; usedKey[c.key] = true;
      }
      if (cands.length !== 5) continue;
      var cc = mul(cands.reduce(function (c,b) { return add(c,b.mid); },[0,0,0]),0.2);
      cands.sort(function (a,b) {
        return Math.atan2(a.mid[0]-cc[0],a.mid[1]-cc[1])-Math.atan2(b.mid[0]-cc[0],b.mid[1]-cc[1]);
      });
      return { A:A, cands:cands, answer:cands.indexOf(ans) };
    }
    return null;
  }

  // 24個の合格した形をくらべる。失敗した形は、そのつどひきなおす。
  function generate() {
    var best = null, accepted = 0, attempts = 0;
    while (accepted < 24 && attempts < 2000) {
      attempts++; randomTree(); buildUnfold(0); buildNet();
      if (!noOverlap()) continue;
      var layout = bestOrientation();

<script>

                t0: performance.now(), dur: dur, done: done };
  }
  function updateAnim(now) {

      if (tk !== st.token) return;

        if (tk !== st.token) return;

      for (i = 0; i < 3; i++) { if (p[i] < mn[i]) mn[i] = p[i]; if (p[i] > mx[i]) mx[i] = p[i]; }

      cam.right[2]*cam.fwd[0]-cam.right[0]*cam.fwd[2],

  function projectAll(pts) {

    for (f = 0; f < 12; f++) {
      var row = [];
      for (k = 0; k < 5; k++) {

    if (st.revealed && vA) {

    }

    if (st.showNum) {
      for (ci = 0; ci < Q.cands.length; ci++) {
        var cc = Q.cands[ci], lp = labelPos(proj, cc.f, cc.k);
        var isSel2 = (st.selected === ci), isAns2 = (st.revealed && ci === Q.answer);
        var col2 = isAns2 ? COL.gold : (isSel2 ? COL.sel : COL.cand);
        var r = drawBadge(lp.x, lp.y, String(ci+1), col2, isSel2 || isAns2,
                          vis(cc.f, cc.k) ? 1 : 0.32);
        lastBadges.push({ i: ci, x: lp.x, y: lp.y, r: r });
      }
      var la = labelPos(proj, Q.A.f, Q.A.k);
      drawBadge(la.x, la.y, "A", st.revealed ? COL.gold : COL.A, true, vA ? 1 : 0.32);
    }
  }

  /* ---------- メインループ ---------- */
  var draggingSlider = false;
  function frame(now) {
    updateAnim(now);
    var Wt = M.worldTransforms(st.fold);
    var pts = [], f, k;
    for (f = 0; f < 12; f++) {
      var row = [];
      for (k = 0; k < 5; k++) row.push(M.tApply(Wt[f], M.net[f][k]));
      pts.push(row);
    }
    updateCamera(pts);
    var proj = projectAll(pts);
    // 各面の外向き法線から「表を見ているか／裏を見ているか」を求める
    var facing = [];
    for (f = 0; f < 12; f++) {
      var p0 = pts[f][0], p1 = pts[f][1], p2 = pts[f][2];
      var ux = p1[0]-p0[0], uy = p1[1]-p0[1], uz = p1[2]-p0[2];
      var vx = p2[0]-p1[0], vy = p2[1]-p1[1], vz = p2[2]-p1[2];
      var nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
      var nl = Math.hypot(nx, ny, nz) || 1;
      var cx = 0, cy = 0, cz = 0;
      for (k = 0; k < 5; k++) { cx += pts[f][k][0]/5; cy += pts[f][k][1]/5; cz += pts[f][k][2]/5; }
      var ex = cam.eye[0]-cx, ey = cam.eye[1]-cy, ez = cam.eye[2]-cz;
      var el = Math.hypot(ex, ey, ez) || 1;
      facing.push((nx*ex + ny*ey + nz*ez) / (nl*el));
    }
    draw(proj, facing, now);
    if (!draggingSlider) {
      var v = Math.round(avgFold() * 100);
      if (+rng.value !== v) rng.value = v;
      pctEl.textContent = v + "%";
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 入力（回転・拡大・タップ） ---------- */
  var pointers = {}, pcount = 0, down = null, pinchBase = null;

  cv.addEventListener("pointerdown", function (e) {
    cv.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    pcount++;
    if (pcount === 1) down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
    if (pcount === 2) { pinchBase = { d: pinchDist(), z: st.zoom }; down = null; }
    e.preventDefault();
  });
  cv.addEventListener("pointermove", function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pcount === 1) {
      if (down) down.moved += Math.abs(dx) + Math.abs(dy);
      st.userCam = true;
      cam.yaw -= dx * 0.008; cam.pitch += dy * 0.008;
      cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch));
      cam.yawT = cam.yaw; cam.pitchT = cam.pitch;
    } else if (pcount >= 2 && pinchBase) {
      var d = pinchDist();
      if (d > 0 && pinchBase.d > 0) {
        st.userCam = true;
        st.zoom = Math.max(0.5, Math.min(4, pinchBase.z * d / pinchBase.d));
      }
    }
    e.preventDefault();
  });
  function endPointer(e) {
    if (!pointers[e.pointerId]) return;
    delete pointers[e.pointerId]; pcount = Math.max(0, pcount - 1);
    if (pcount < 2) pinchBase = null;
    if (down && performance.now() - down.t < 500 && down.moved < 12) {
      var r = cv.getBoundingClientRect();
      hitTest(e.clientX - r.left, e.clientY - r.top);
    }
    down = null;
  }
  cv.addEventListener("pointerup", endPointer);
  cv.addEventListener("pointercancel", endPointer);
  cv.addEventListener("wheel", function (e) {
    e.preventDefault();
    st.userCam = true;
    st.zoom = Math.max(0.5, Math.min(4, st.zoom * Math.exp(-e.deltaY * 0.0015)));
  }, { passive: false });

  function pinchDist() {
    var ids = Object.keys(pointers);
    if (ids.length < 2) return 0;
    var a = pointers[ids[0]], b = pointers[ids[1]];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function hitTest(x, y) {
    var best = -1, bd = 1e9;
    for (var i = 0; i < lastBadges.length; i++) {
      var b = lastBadges[i], d = Math.hypot(x - b.x, y - b.y);
      if (d < b.r + 14 && d < bd) { bd = d; best = b.i; }
    }
    if (best >= 0) select(best);
  }

  function select(i) {
    st.selected = i;
    if (!st.revealed) setMsg(String(i+1) + "番を選びました。「答えを表示」で確かめましょう。", "");
    else judge();
  }
  function setMsg(text, cls) { msgEl.textContent = text; msgEl.className = cls || ""; }

  function judge() {
    var ansNo = Q.answer + 1;
    if (st.selected < 0) setMsg("Aと一致するのは" + ansNo + "番です。（候補を選んでから押すと正誤を判定します）", "info");
    else if (st.selected === Q.answer) setMsg("正解！ Aと一致するのは" + ansNo + "番です", "ok");
    else setMsg("不正解。Aと一致するのは" + ansNo + "番です", "ng");
  }

  /* ---------- ボタン ---------- */
  document.getElementById("btnStep").addEventListener("click", function () {
    st.anim = null; st.token++;
    var f = nextUnfolded();
    if (f < 0) { setMsg("すべての面を折り終えています。「リセット」で展開図に戻せます。", "info"); return; }
    foldFace(f);
  });

  document.getElementById("btnAuto").addEventListener("click", function () {
    st.anim = null; st.token++;
    var list = M.foldOrder.filter(function (f) { return st.fold[f] < 0.999; });
    if (!list.length) { setMsg("すべての面を折り終えています。「リセット」で展開図に戻せます。", "info"); return; }
    (function chain(i) {
      if (i >= list.length) return;
      foldFace(list[i], function () { chain(i + 1); });
    })(0);
  });

  document.getElementById("btnAnswer").addEventListener("click", function () {
    st.anim = null; st.token++; st.aim = null;
    var list = M.foldOrder.filter(function (f) { return st.fold[f] < 0.999; });
    st.revealed = true;
    judge();
    startAnim(list, 900 * st.speed, focusAnswerEdge);
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    st.anim = null; st.token++; st.aim = null;
    for (var i = 0; i < 12; i++) st.fold[i] = 0;
    st.revealed = false; st.selected = -1;
    st.userCam = false; st.zoom = 1;
    setMsg("番号の丸をタップして答えを選んでください。", "");
  });

  var btnSpeed = document.getElementById("btnSpeed");
  btnSpeed.addEventListener("click", function () {
    st.speed = st.speed === 1 ? 2.4 : 1;
    btnSpeed.textContent = st.speed === 1 ? "ゆっくり" : "標準へ";
    btnSpeed.className = st.speed === 1 ? "mini" : "mini on";
  });

  var btnNum = document.getElementById("btnNum");
  btnNum.addEventListener("click", function () {
    st.showNum = !st.showNum;
    btnNum.textContent = st.showNum ? "数字を隠す" : "数字を表示";
    btnNum.className = st.showNum ? "mini" : "mini on";
  });

  rng.addEventListener("pointerdown", function () { draggingSlider = true; });
  window.addEventListener("pointerup", function () { draggingSlider = false; });
  rng.addEventListener("input", function () {
    st.anim = null; st.token++; st.aim = null;
    var v = (+rng.value) / 100;
    for (var i = 0; i < M.foldOrder.length; i++) st.fold[M.foldOrder[i]] = v;
    pctEl.textContent = rng.value + "%";
  });

  /* 正解の辺が正面に来るようカメラを向ける */
  function focusAnswerEdge() {
    var Wt = M.worldTransforms(st.fold);
    var A = Q.A;
    var p0 = M.tApply(Wt[A.f], M.net[A.f][A.k]);
    var p1 = M.tApply(Wt[A.f], M.net[A.f][(A.k+1) % 5]);
    var mid = [(p0[0]+p1[0])/2, (p0[1]+p1[1])/2, (p0[2]+p1[2])/2];
    var d = [mid[0]-cam.center[0], mid[1]-cam.center[1], mid[2]-cam.center[2]];
    var l = Math.hypot(d[0], d[1], d[2]);
    if (l < 1e-6) return;
    st.aim = {
      yaw: Math.atan2(d[1], d[0]),
      pitch: Math.max(-1.2, Math.min(1.2, Math.asin(d[2] / l)))
    };
  }

  // URLのシードを読み、おなじ問題をどの端末でもひらけるようにする。
  var seedLabel = document.getElementById("seedLabel");
  var btnNew = document.getElementById("btnNew");
  function readSeed() {
    var m = /^#seed=(\d+)$/.exec(window.location.hash);
    if (!m) return null;
    var n = Number(m[1]);
    return Number.isInteger(n) && n >= 0 && n <= 4294967295 ? n : null;
  }
  function freshSeed() {
    var n;
    if (window.crypto && window.crypto.getRandomValues) {
      var a = new Uint32Array(1); window.crypto.getRandomValues(a); n = a[0];
    } else n = (Date.now() ^ Math.floor(Math.random()*4294967296)) >>> 0;
    if (n === M.seed) n = (n+1) >>> 0;
    return n;
  }
  function writeSeed(seed) {
    var hash = "#seed=" + seed;
    if (window.location.hash === hash) return;
    try { window.history.replaceState(null,"",hash); }
    catch (err) { window.location.hash = hash; }
  }
  function loadProblem(seed) {
    // 先に作りきる。失敗したときは、いまの問題を保つ。
    var next = M.create(seed);
    st.anim = null; st.token++; st.aim = null;
    M = next; MODEL = next; Q = M.quiz;
    st.fold = new Array(12).fill(0); st.selected = -1; st.revealed = false;
    st.userCam = false; st.zoom = 1; st.dragging = false;
    draggingSlider = false; pointers = {}; pcount = 0; down = null; pinchBase = null;
    lastBadges = []; cam.inited = false; cam.fit = 0;
    cam.yaw = cam.yawT = -Math.PI/2; cam.pitch = cam.pitchT = 1.40;
    rng.value = 0; pctEl.textContent = "0%";
    seedLabel.textContent = "シード：" + M.seed;
    writeSeed(M.seed);
    setMsg("番号の丸をタップして答えを選んでください。", "");
    var rep = M.selfTest();
    rep.forEach(function (r) { console.log((r.ok ? "OK  " : "NG  ")+r.name+(r.detail ? "  ["+r.detail+"]" : "")); });
    console.log("シード " + M.seed + "：自己検証すべて合格");
  }
  btnNew.addEventListener("click", function () {
    btnNew.disabled = true;
    try { loadProblem(freshSeed()); }
    catch (err) { console.error(err); setMsg("作問できませんでした。もう一度「新しい問題」を押してください。", "info"); }
    finally { btnNew.disabled = false; }
  });
  window.addEventListener("hashchange", function () {
    var seed = readSeed();
    if (seed === M.seed) return;
    try { loadProblem(seed === null ? freshSeed() : seed); }
    catch (err) { console.error(err); writeSeed(M.seed); setMsg("このシードで作問できませんでした。", "info"); }
  });

  /* ---------- 起動 ---------- */
  try { var initialSeed = readSeed(); loadProblem(initialSeed === null ? freshSeed() : initialSeed); }
  catch (err) { console.error(err); seedLabel.textContent = "シード："+M.seed; writeSeed(M.seed); }

  resize();
  requestAnimationFrame(frame);

  // コンソールに自己検証の結果を出す
  try {
    var rep = M.selfTest(), allOK = true;
    for (var i = 0; i < rep.length; i++) {
      if (!rep[i].ok) allOK = false;
      console.log((rep[i].ok ? "OK  " : "NG  ") + rep[i].name + (rep[i].detail ? "  [" + rep[i].detail + "]" : ""));
    }
    console.log(allOK ? "自己検証：すべて合格" : "自己検証：問題あり");
  } catch (err) { console.error(err); }
})();
</script>
</body>
</html>
